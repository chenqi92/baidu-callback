<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FF6B35">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<title>正在返回猿音…</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #1a1a1a 0%, #2a1810 100%);
    color: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 380px;
    width: 100%;
    text-align: center;
    padding: 40px 28px;
  }
  .logo {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, #FF6B35, #F7931E);
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 8px 24px rgba(255, 107, 53, 0.35);
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: 0.5px;
  }
  p {
    font-size: 14px;
    line-height: 1.6;
    color: #b0b0b0;
    margin: 0 0 24px;
  }
  .spinner {
    width: 28px;
    height: 28px;
    margin: 16px auto 24px;
    border: 3px solid rgba(255, 107, 53, 0.2);
    border-top-color: #FF6B35;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn {
    display: inline-block;
    padding: 12px 28px;
    background: linear-gradient(135deg, #FF6B35, #F7931E);
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(255, 107, 53, 0.35);
    transition: transform 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn[hidden] { display: none; }
  .error {
    color: #ff8a5c;
    font-size: 13px;
    word-break: break-all;
    background: rgba(255, 107, 53, 0.08);
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255, 107, 53, 0.2);
    margin-top: 16px;
  }
  .error[hidden] { display: none; }
  .hint {
    margin-top: 20px;
    font-size: 12px;
    color: #6a6a6a;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">猿</div>
    <h1 id="title">正在返回猿音…</h1>
    <p id="subtitle">如果未自动跳转，请点击下方按钮</p>
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <a id="manualBtn" class="btn" href="#" hidden>打开猿音</a>
    <div id="errorBox" class="error" hidden></div>
    <p class="hint">本页面仅用于百度网盘授权回调，不收集任何信息。</p>
  </main>
<script>
(function () {
  "use strict";

  var APP_SCHEME = "primuse://baidu/callback";

  function readParams() {
    // 百度部分流程把 token 放在 fragment 里（implicit grant），
    // 授权码模式则放在 query 里 —— 两边都解析以兼容。
    var combined = {};
    var qs = window.location.search.replace(/^\?/, "");
    var hash = window.location.hash.replace(/^#/, "");
    [qs, hash].forEach(function (raw) {
      if (!raw) return;
      raw.split("&").forEach(function (pair) {
        if (!pair) return;
        var eq = pair.indexOf("=");
        var k = eq >= 0 ? pair.slice(0, eq) : pair;
        var v = eq >= 0 ? pair.slice(eq + 1) : "";
        if (k) combined[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, " "));
      });
    });
    return combined;
  }

  function buildAppURL(params) {
    var keep = ["code", "state", "error", "error_description", "access_token", "refresh_token", "expires_in", "scope", "token_type"];
    var parts = [];
    keep.forEach(function (k) {
      if (params[k] != null && params[k] !== "") {
        parts.push(encodeURIComponent(k) + "=" + encodeURIComponent(params[k]));
      }
    });
    return APP_SCHEME + (parts.length ? "?" + parts.join("&") : "");
  }

  function showError(msg) {
    document.getElementById("spinner").hidden = true;
    document.getElementById("title").textContent = "授权未完成";
    document.getElementById("subtitle").textContent = "请回到猿音重试，或点击下方按钮再试一次。";
    var box = document.getElementById("errorBox");
    box.textContent = msg;
    box.hidden = false;
  }

  var params = readParams();

  if (params.error) {
    showError("[" + params.error + "] " + (params.error_description || ""));
    // 仍然把错误传回 App，让 App 显示对应错误
    var errURL = buildAppURL(params);
    var btn = document.getElementById("manualBtn");
    btn.href = errURL;
    btn.textContent = "返回猿音";
    btn.hidden = false;
    setTimeout(function () { window.location.replace(errURL); }, 200);
    return;
  }

  if (!params.code && !params.access_token) {
    showError("URL 中没有授权码（缺少 code 参数）。请确认百度网盘开放平台的回调地址配置正确。");
    return;
  }

  var appURL = buildAppURL(params);
  var btn = document.getElementById("manualBtn");
  btn.href = appURL;
  btn.hidden = false;

  // 先延迟一帧让按钮可见，再触发跳转 ——
  // ASWebAuthenticationSession 监听到自定义 scheme 即关闭 Safari 弹窗，
  // 此时页面会立即被销毁，所以视觉上几乎不可见。
  setTimeout(function () {
    window.location.replace(appURL);
  }, 50);
})();
</script>
</body>
</html>
